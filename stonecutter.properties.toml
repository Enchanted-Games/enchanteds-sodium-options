[mod]
id = "enchanteds_sodium_options"
name = "Enchanted's Sodium Options"
description = "Changes Sodium's video settings screen to match the style of vanilla screens better"
group = "games.enchanted"
version = "1.4.1"
license = "CC BY-NC 4.0"
website_url = "https://github.com/Enchanted-Games/enchanteds-sodium-options"
source_url = "https://github.com/Enchanted-Games/enchanteds-sodium-options"
issue_tracker = "https://github.com/Enchanted-Games/enchanteds-sodium-options/issues"
icon = "assets/enchanteds_sodium_options/icon.png"

# neoforge versions: https://projects.neoforged.net/neoforged/neoforge
# fabric versions: https://fabricmc.net/develop/

[fabric]
deps.fabric-loader = "0.20.0"
dep_str.fabric-loader = ">=0.20.0"

["26.3"]
deps.minecraft = "26.3"

deps.sodium_compiled_against = "0.9.2"
deps.sodium = "0.9.3-beta.1+mc26.3"
deps.iris = "1.11.7+26.3"

[fabric."26.3"]
dep_str.minecraft = ">=26.3 <26.4"

deps.fabric-api = "0.161.0+26.3"
dep_str.fabric-api = ">=0.161.0+26.3"

deps.modmenu = "21.0.0"

dep_str.sodium = ">=0.8.11 <0.9.4"

[neoforge."26.3"]
dep_str.minecraft = "[26.3,26.4)"

deps.neoforge = "26.3.0.100"

dep_str.sodium = "[0.8.11,0.9.4)"
