modLoader="javafml"
loaderVersion="[2,)"
license="${license}"
issueTrackerURL="${issue_tracker}"

[[mods]]
modId="${id}"
version="${version}"
displayName="${name}"
${neo_icon_property}="${icon}"
logoBlur=false
displayURL="${website_url}"
authors="Enchanted_Games"
description='''
${description}
'''

[[mixins]]
config="${id}.mixins.json"

[[dependencies.${id}]]
modId="minecraft"
type="required"
versionRange="${minecraft}"
side="CLIENT"

[[dependencies.${id}]]
modId="sodium"
type="required"
versionRange="${sodium_dep_str}"
side="CLIENT"


[[dependencies.${id}]]
modId="betterfpsdist"
type="discouraged"
reason="This mod forces the vanilla video settings screen to open instead of the Sodium one. When used in combination with Enchanted's Sodium Options this can be very unintuitive and confusing as both screens look similar."
versionRange="[0,)"
side="CLIENT"
